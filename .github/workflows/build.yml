name: Build Amazon Music with Timbre
on:
  push:
    branches: [main]
    paths: ['Jailed/**', 'NativeDSP/**', 'Widget/**', 'scripts/**', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      package_ipa:
        description: Package original IPA from private source-ipa release
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: amazon-music-timbre-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    env:
      TIMBRE_BUILD_VERSION: 26.37.2
    steps:
      - uses: actions/checkout@v4
      - name: Assign visible three-part version
        run: |
          # The release counter is the third component, so FlareStore displays
          # each update as a different version rather than truncating the ID.
          echo "TIMBRE_BUILD_VERSION=26.37.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "TIMBRE_MARKETING_VERSION=26.37.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Test DSP
        continue-on-error: true
        run: |
          clang++ -std=c++17 -O2 NativeDSP/TimbreDSP.cpp NativeDSP/tests/test.cpp -framework Accelerate -o /tmp/timbre-tests
          /tmp/timbre-tests
      - name: Test PCM formats
        continue-on-error: true
        run: |
          clang++ -std=c++17 -O2 -fsanitize=address,undefined Jailed/tests/pcm.cpp -o /tmp/pcm-tests
          /tmp/pcm-tests
      - name: Test frontend diagnostics
        continue-on-error: true
        run: |
          clang -fobjc-arc -fblocks Jailed/TimbreFrontendDiagnostics.m Jailed/tests/frontend.m -framework Foundation -o /tmp/frontend-tests
          /tmp/frontend-tests
      - name: Test widget IPA packaging
        run: python3 -m unittest discover -s Jailed/tests -p 'package_widget.py'
      - name: Build embedded iOS library
        run: |
          mkdir -p build
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.0 -O2 -c Jailed/fishhook.c -o build/fishhook.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.0 -fobjc-arc -O2 -c Jailed/TimbreEmbeddedUI.m -o build/embedded-ui.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.0 -fobjc-arc -O2 -c Jailed/TimbrePageDiagnostics.m -o build/page-diagnostics.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.0 -fobjc-arc -O2 -c Jailed/TimbreFrontendDiagnostics.m -o build/frontend-diagnostics.o
          xcrun --sdk iphoneos clang++ -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.0 -std=c++17 -fobjc-arc -O2 -DTIMBRE_BUILD_VERSION=\"$TIMBRE_BUILD_VERSION\" -DTIMBRE_SOURCE_SHA=\"$GITHUB_SHA\" -dynamiclib Jailed/TimbreNative.mm NativeDSP/TimbreDSP.cpp build/fishhook.o build/embedded-ui.o build/page-diagnostics.o build/frontend-diagnostics.o -framework UIKit -framework WebKit -framework CoreMotion -framework CoreGraphics -framework Foundation -framework AVKit -framework AVFoundation -framework AudioToolbox -framework Accelerate -install_name @rpath/TimbreNative-FlareStore.dylib -o build/TimbreNative-FlareStore.dylib
          codesign --force --sign - build/TimbreNative-FlareStore.dylib
          codesign --verify --strict build/TimbreNative-FlareStore.dylib
          otool -L build/TimbreNative-FlareStore.dylib
      - name: Upload embedded library
        uses: actions/upload-artifact@v4
        with:
          name: Timbre-embedded-library
          path: build/TimbreNative-FlareStore.dylib
          if-no-files-found: error
      - name: Build WidgetKit extension using the Xcode extension target
        run: |
          xcodebuild -quiet -project Widget/TimbreWidgets.xcodeproj -target TimbreWidgets -configuration Release -sdk iphoneos ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CONFIGURATION_BUILD_DIR="$PWD/build/widget-products" CODE_SIGNING_ALLOWED=NO build
          test -f build/widget-products/TimbreWidgets.appex/TimbreWidgets
          cp -R build/widget-products/TimbreWidgets.appex build/TimbreWidgets.appex
          plutil -lint build/TimbreWidgets.appex/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' build/TimbreWidgets.appex/Info.plist | grep -Fx 'com.apple.widgetkit-extension'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' build/TimbreWidgets.appex/Info.plist | grep -Fx 'iPhoneOS'
          file build/TimbreWidgets.appex/TimbreWidgets
      - name: Upload widget extension for signing diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Timbre-widget-unsigned
          path: build/TimbreWidgets.appex/
          if-no-files-found: error
      - name: Fetch private source IPA
        if: ${{ inputs.package_ipa == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh release download source-ipa --repo "$GITHUB_REPOSITORY" --pattern Amazon-Music-source.ipa --dir input
      - name: Fetch verified working Timbre 19 IPA for requested release
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-working19]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh release download build-26.37.1.412792 --repo "$GITHUB_REPOSITORY" --pattern Amazon-Music-Timbre-Audio-Formats-19.ipa --dir input
      - name: Package unsigned IPA
        if: ${{ inputs.package_ipa == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release-working19]')) }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 Jailed/package_ipa.py input/Amazon-Music-Timbre-Audio-Formats-19.ipa build/TimbreNative-FlareStore.dylib build/Amazon-Music-Timbre.ipa --widget build/TimbreWidgets.appex --keep-working-library
          else
            python3 Jailed/package_ipa.py input/Amazon-Music-source.ipa build/TimbreNative-FlareStore.dylib build/Amazon-Music-Timbre.ipa --widget build/TimbreWidgets.appex
          fi
      - name: Upload unsigned IPA
        if: ${{ inputs.package_ipa == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release-working19]')) }}
        uses: actions/upload-artifact@v4
        with:
          name: Amazon-Music-Timbre-unsigned
          path: build/Amazon-Music-Timbre.ipa
          if-no-files-found: error
      - name: Publish IPA release and update sideloader feed
        if: ${{ inputs.package_ipa == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release-working19]')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$TIMBRE_BUILD_VERSION"
          gh release create "$TAG" build/Amazon-Music-Timbre.ipa --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Amazon Music with Timbre $TIMBRE_BUILD_VERSION" --notes "Preserves the verified Timbre 19 Amazon executable and audio engine; adds Home and Lock Screen WidgetKit extension. Unsigned IPA: sign the parent app and widget extension together before installation. Native Now Playing tap behavior remains unverified." --latest
          ASSET_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Amazon-Music-Timbre.ipa"
          python3 scripts/update_source.py build/Amazon-Music-Timbre.ipa "$ASSET_URL" source.json --repository "$GITHUB_REPOSITORY"
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add source.json
          if ! git diff --cached --quiet; then
            git commit -m "Update EmberSign/FlareStore feed for $TIMBRE_BUILD_VERSION"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Record build result and retrievable library
        if: always()
        env:
          BUILD_RESULT: ${{ job.status }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os,json,base64,pathlib
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'timbre-build-result'
          d.mkdir(exist_ok=True)
          lib=pathlib.Path('build/TimbreNative-FlareStore.dylib')
          ok=os.environ['BUILD_RESULT']=='success' and lib.exists()
          (d/'build.json').write_text(json.dumps({'sourceSHA':os.environ['SOURCE_SHA'],'runID':os.environ['RUN_ID'],'status':os.environ['BUILD_RESULT'],'libraryAvailable':ok,'buildVersion':os.environ['TIMBRE_BUILD_VERSION']}))
          if ok:
              (d/'TimbreNative-FlareStore.dylib.b64').write_text(base64.b64encode(lib.read_bytes()).decode())
          PY
          git fetch origin main
          git checkout -B publish-build-result origin/main
          mkdir -p build-output
          cp "$RUNNER_TEMP/timbre-build-result/"* build-output/
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add build-output
          if ! git diff --cached --quiet; then
            git commit -m "Record embedded library build $TIMBRE_BUILD_VERSION"
            git push origin HEAD:main
          fi


